name: Assemble project source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-project.yml'
      - '.upload_payload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .upload_payload/part00.txt \
            .upload_payload/part01.txt \
            .upload_payload/part02.txt \
            .upload_payload/part03.txt \
            .upload_payload/part04.txt \
            .upload_payload/fix05_0.txt \
            .upload_payload/fix05_1.txt \
            .upload_payload/fix05_2.txt \
            .upload_payload/fix05_3.txt \
            .upload_payload/fix05_4.txt \
            .upload_payload/fix05_5.txt \
            .upload_payload/part06.txt \
            .upload_payload/fix07_0.txt \
            .upload_payload/fix07_1.txt \
            .upload_payload/fix07_2.txt \
            .upload_payload/fix07_3.txt \
            .upload_payload/fix07_4.txt \
            .upload_payload/fix07_5.txt \
            .upload_payload/part08.txt \
            | tr -d '\n\r ' | base64 --decode > /tmp/project.zip
          unzip -t /tmp/project.zip
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project
          rsync -a /tmp/project/ ./
          rm -rf .upload_payload

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Import project source files'
            git push origin HEAD:main
          fi
